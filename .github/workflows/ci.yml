name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check quickstart.sh
        run: bash -n quickstart.sh

      - name: Syntax check install.sh
        run: bash -n install.sh
